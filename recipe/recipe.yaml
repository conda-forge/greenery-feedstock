schema_version: 1

context:
  name: greenery
  version: "4.2.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/greenery-${{ version }}.tar.gz
  sha256: 546e8d2764949f6999d7cb56a5cbb0dc9be38f34489ce2abb95db622dac7b2cd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - greenery
      python_version: ["${{ python_min }}.*", "3.*"]
      pip_check: true

about:
  summary: Greenery allows manipulation of regular expressions as finite state machines
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/qntm/greenery

extra:
  recipe-maintainers:
    - beenje
